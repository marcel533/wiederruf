<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeStudio Ultimate - Pro</title>
   <link href="https://fonts.bunny.net/css?family=orbitron:wght@400;900|inter:wght@400;700" rel="stylesheet" />
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0f0f0f; --sidebar-bg: #181818; --editor-bg: #1e1e1e;
            --accent: #007acc; --text: #cccccc; --border: #333; --header-bg: #252526;
            --danger: #f44336; --success: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: var(--header-bg); border-bottom: 1px solid var(--border); }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-download { background: var(--success); margin-left: 10px; }

        .main { display: flex; flex-grow: 1; overflow: hidden; }

        /* Sidebar & Scanner */
        .sidebar { width: 240px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px; font-size: 11px; color: #888; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .file-list { flex-grow: 1; overflow-y: auto; }
        .file-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #252525; font-size: 14px; }
        .file-item.active { background: #37373d; border-left: 4px solid var(--accent); }

        #security-panel { padding: 12px; background: #1e1e1e; border-top: 1px solid var(--border); font-size: 12px; }
        .status-good { color: var(--success); }
        .status-warn { color: #ffeb3b; }
        .status-danger { color: var(--danger); }

        .editor-container { flex: 1; display: flex; flex-direction: column; background: var(--editor-bg); }
        textarea { flex-grow: 1; background: transparent; color: #dcdcdc; border: none; padding: 20px; font-family: 'Consolas', monospace; font-size: 14px; outline: none; resize: none; line-height: 1.5; }
        
        .preview-container { width: 40%; background: white; border-left: 1px solid var(--border); }
        iframe { width: 100%; height: 100%; border: none; }

        /* Captcha Overlay */
        #captcha-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }
        .captcha-box { background: #252526; padding: 40px; border-radius: 12px; text-align: center; border: 1px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #captcha-input { background: #1e1e1e; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 4px; width: 100px; text-align: center; font-size: 18px; margin: 15px 0; }
    .file-item { 
    padding: 10px 15px; 
    cursor: pointer; 
    border-bottom: 1px solid #252525; 
    font-size: 14px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
}
.file-item:hover { background: #2a2d2e; }
.file-item.active { background: #37373d; border-left: 4px solid var(--accent); }

.delete-btn { 
    color: #888; 
    font-weight: bold; 
    padding: 2px 8px; 
    border-radius: 4px; 
    transition: 0.2s;
}
.delete-btn:hover { 
    background: var(--danger); 
    color: white; 
}
    
    </style>
</head>
<body>

<div id="captcha-overlay">
    <div class="captcha-box">
        <h2 style="color: white; margin-top: 0;">🤖 Bot-Schutz</h2>
        <p>Bitte löse die Aufgabe:</p>
        <h1 id="captcha-question" style="color: var(--accent); margin: 10px 0;"></h1>
        <input type="number" id="captcha-input" placeholder="?">
        <button class="btn" onclick="verifyCaptcha()" style="display: block; width: 100%;">Bestätigen</button>
        <p id="captcha-error" style="color: var(--danger); font-size: 13px; margin-top: 15px; display: none;">❌ Falsch! Versuche es erneut.</p>
    </div>
</div>

<header>
    <div style="display: flex; align-items: center; gap: 12px;">
    <img src="https://i.pinimg.com/736x/ea/b3/4b/eab34b728f992348049cae4bbdce8fda.jpg" alt="Logo" style="height: 90px; width: auto;">
    <strong style="color: white; letter-spacing: 1px;">
        CODESTUDIO <span style="color:var(--accent)">PRO</span>
    </strong>
</div>
    <button class="btn btn-download" onclick="downloadAll()">📦 Export mit Wasserzeichen (.ZIP)</button>
</header>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-header">Explorer <span onclick="addNewFile()" style="cursor:pointer; color:var(--accent)">+</span></div>
        <div id="file-list" class="file-list"></div>
        <div id="security-panel">
            <strong>Security Scan:</strong>
            <div id="scan-result" class="status-good">✓ Sicher</div>
        </div>
    </div>
    <div class="editor-container">
        <textarea id="codeEditor" spellcheck="false" placeholder="Hier tippen..."></textarea>
    </div>
    <div class="preview-container">
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    let files = {
        "index.html": "<h1>Willkommen</h1>\n<p>Captcha gelöst!</p>",
        "style.css": "body { background: #f4f4f4; text-align: center; font-family: sans-serif; }",
        "script.js": "console.log('Online Editor aktiv');"
    };
    let currentFile = "index.html";
    let captchaAnswer = 0;

    // --- CAPTCHA FIX ---
    function initCaptcha() {
        const n1 = Math.floor(Math.random() * 10) + 1;
        const n2 = Math.floor(Math.random() * 10) + 1;
        captchaAnswer = n1 + n2;
        document.getElementById('captcha-question').innerText = `${n1} + ${n2} = ?`;
    }

    function verifyCaptcha() {
        const val = parseInt(document.getElementById('captcha-input').value);
        if (val === captchaAnswer) {
            document.getElementById('captcha-overlay').style.display = 'none';
        } else {
            document.getElementById('captcha-error').style.display = 'block';
            document.getElementById('captcha-input').value = "";
            initCaptcha();
        }
    }

    // --- SECURITY SCANNER ---
    function scanCode(code) {
        const display = document.getElementById('scan-result');
        if (/eval\(|innerHTML|document\.write/g.test(code)) {
            display.innerText = "⚠ Risiko erkannt";
            display.className = "status-warn";
        } else {
            display.innerText = "✓ Sicher";
            display.className = "status-good";
        }
    }

    // --- DOWNLOAD MIT WASSERZEICHEN FIX ---
    async function downloadAll() {
        const zip = new JSZip();
        const siteUrl = "https://marcel533.github.io/online-code-editor/";
        const markText = `\n\n/* ERSTELLT MIT: ${siteUrl} */`;
        const markHtml = `\n\n`;

        Object.keys(files).forEach(name => {
            let content = files[name];
            if (name.endsWith(".js") || name.endsWith(".css")) content += markText;
            else if (name.endsWith(".html")) content += markHtml;
            zip.file(name, content);
        });

        // Hier war der Fehler (Zeilenumbruch korrigiert):
        zip.file("Urheberrecht.txt", "Dieses Projekt wurde mit CodeStudio Ultimate erstellt.\nURL: " + siteUrl + "\nExport am: " + new Date().toLocaleString());

        const blob = await zip.generateAsync({type:"blob"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Projekt_Export.zip";
        link.click();
    }

    function renderFileList() {
        const list = document.getElementById('file-list');
        list.innerHTML = "";
        Object.keys(files).forEach(name => {
            const div = document.createElement('div');
            div.className = `file-item ${name === currentFile ? 'active' : ''}`;
            div.innerText = name;
            div.onclick = () => {
                files[currentFile] = document.getElementById('codeEditor').value;
                currentFile = name;
                document.getElementById('codeEditor').value = files[name];
                renderFileList();
                updatePreview();
            };
            list.appendChild(div);
        });
    }

    function updatePreview() {
        files[currentFile] = document.getElementById('codeEditor').value;
        scanCode(files[currentFile]);
        const doc = document.getElementById('preview').contentWindow.document;
        doc.open();
        let css = `<style>${files["style.css"]}</style>`;
        doc.write(css + files["index.html"]);
        doc.close();
    }

    function addNewFile() {
        const n = prompt("Dateiname:");
        if(n) { files[n] = ""; renderFileList(); }
    }

    document.getElementById('codeEditor').addEventListener('input', updatePreview);

    window.onload = () => {
        initCaptcha();
        document.getElementById('codeEditor').value = files[currentFile];
        renderFileList();
        updatePreview();
    };
function renderFileList() {
    const list = document.getElementById('file-list');
    list.innerHTML = "";
    
    Object.keys(files).forEach(name => {
        const div = document.createElement('div');
        div.className = `file-item ${name === currentFile ? 'active' : ''}`;
        
        // Dateiname und Lösch-Button erstellen
        div.innerHTML = `
            <span>${name}</span>
            <span class="delete-btn" onclick="deleteFile(event, '${name}')">×</span>
        `;
        
        div.onclick = () => {
            files[currentFile] = document.getElementById('codeEditor').value;
            currentFile = name;
            document.getElementById('codeEditor').value = files[name];
            renderFileList();
            updatePreview();
        };
        list.appendChild(div);
    });
    
    const fileNameDisplay = document.getElementById('current-filename');
    if(fileNameDisplay) fileNameDisplay.innerText = currentFile;
}

function deleteFile(event, name) {
    // Verhindert, dass die Datei beim Klicken auf das X gleichzeitig ausgewählt wird
    event.stopPropagation();

    // Sicherheitsabfrage
    if (Object.keys(files).length <= 1) {
        alert("Mindestens eine Datei muss übrig bleiben!");
        return;
    }

    if (confirm(`Möchtest du die Datei "${name}" wirklich löschen?`)) {
        delete files[name];

        // Falls die gelöschte Datei gerade offen war, zur ersten verfügbaren Datei springen
        if (currentFile === name) {
            currentFile = Object.keys(files)[0];
            document.getElementById('codeEditor').value = files[currentFile];
        }

        renderFileList();
        updatePreview();
    }
}
</script>

</body>
</html>
